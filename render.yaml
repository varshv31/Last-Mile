databases:
  - name: lmd-db
    plan: free # Can be upgraded as needed
    databaseName: lmd_db
    user: lmd_user

services:

  # Backend Web Service
  - type: web
    name: lmd-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: lmd-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-vercel-frontend-url.vercel.app" # To be updated after Vercel deployment
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: EMAIL_DISABLED
        value: "true"
      - key: SMS_DISABLED
        value: "true"
